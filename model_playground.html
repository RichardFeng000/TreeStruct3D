<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blender 模型参数编辑器</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b10;
      --panel: #11161f;
      --panel-2: #171e29;
      --line: #283344;
      --text: #edf3fb;
      --muted: #94a3b8;
      --accent: #63a6ff;
      --accent-soft: rgba(99, 166, 255, 0.16);
      --danger: #ff8d8d;
      --success: #63d69a;
      --edge-confirmed: #55d98b;
      --edge-code: #63a6ff;
      --edge-anchor: #45c9c0;
      --edge-coupled: #ad8cff;
      --edge-contact: #e7b45d;
      --edge-broken: #ff7474;
      --edge-unknown: #77869b;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, select { font: inherit; }

    button, select, input[type="number"], input[type="text"] {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
    }

    button {
      min-height: 36px;
      padding: 7px 12px;
      cursor: pointer;
    }

    button:hover { border-color: #465976; }

    button:focus-visible,
    select:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #07101d;
      font-weight: 600;
    }

    button.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: #cfe4ff;
    }

    #app {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      height: 100%;
    }

    .topbar {
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 58px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(17, 22, 31, 0.95);
      backdrop-filter: blur(12px);
    }

    .brand {
      min-width: max-content;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: 0.01em;
    }

    .model-picker,
    .source-picker {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .source-picker {
      flex: 0 1 310px;
      min-width: 220px;
    }

    .model-picker {
      min-width: 240px;
      flex: 1;
    }

    .model-picker label,
    .source-picker label {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    #model-select,
    #source-select {
      width: min(440px, 100%);
      height: 36px;
      padding: 0 10px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .switch {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .workspace {
      display: grid;
      grid-template-columns: 280px minmax(520px, 1.35fr) minmax(380px, 0.9fr);
      min-height: 0;
    }

    .sidebar {
      min-height: 0;
      overflow: auto;
      border-right: 1px solid var(--line);
      background: var(--panel);
    }

    .sidebar-head {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(17, 22, 31, 0.96);
      backdrop-filter: blur(10px);
    }

    .sidebar-head h1 {
      margin: 0 0 5px;
      font-size: 14px;
      font-weight: 650;
    }

    .sidebar-head p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    #controls { padding: 6px 16px 24px; }

    .control-group {
      padding: 14px 0 4px;
      border-bottom: 1px solid rgba(40, 51, 68, 0.7);
    }

    .control-group:last-child { border-bottom: 0; }

    .control-group h2 {
      margin: 0 0 13px;
      color: #c8d4e3;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .field { margin-bottom: 15px; }

    .field:last-child { margin-bottom: 10px; }

    .field-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
    }

    .field-head-meta {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 7px;
    }

    .field-label {
      color: #dce6f2;
      font-size: 12px;
    }

    .field-value {
      min-width: 54px;
      color: var(--accent);
      font-size: 12px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .visibility-toggle {
      min-width: 66px;
      height: 27px;
      padding: 0 8px;
      border-color: #35506b;
      color: #9fd2ff;
      font-size: 11px;
    }

    .visibility-toggle.is-hidden {
      border-color: #70434a;
      background: rgba(150, 57, 68, 0.14);
      color: #ff9ea8;
    }

    .field.part-hidden .field-label,
    .field.part-hidden .field-value {
      color: #778394;
    }

    .field.part-hidden .range-row { opacity: 0.42; }

    .range-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 70px;
      align-items: center;
      gap: 9px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    input[type="number"], input[type="text"], .field select {
      width: 100%;
      height: 34px;
      padding: 0 8px;
    }

    .field select { padding: 0 9px; }

    .check-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 32px;
    }

    input[type="checkbox"] { accent-color: var(--accent); }

    .graph-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      min-width: 0;
      min-height: 0;
      border-right: 1px solid var(--line);
      background: #0d121a;
    }

    .graph-panel.graph-expanded {
      position: fixed;
      inset: 58px 0 0;
      z-index: 20;
      border: 0;
      box-shadow: 0 0 0 1px var(--line), 0 20px 60px rgba(0, 0, 0, 0.55);
    }

    .graph-toolbar {
      display: grid;
      gap: 9px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(17, 22, 31, 0.96);
    }

    .graph-tabs,
    .graph-actions,
    .anchor-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .graph-tabs { flex-wrap: wrap; }

    .graph-tabs button,
    .graph-actions button,
    .anchor-controls button {
      min-height: 31px;
      padding: 5px 9px;
      font-size: 11px;
    }

    .anchor-controls {
      flex-wrap: wrap;
      padding: 8px;
      border: 1px solid #26364a;
      border-radius: 8px;
      background: #0c131d;
    }

    .anchor-controls[hidden] { display: none; }

    .anchor-controls .anchor-mode.active {
      border-color: var(--accent);
      background: rgba(99, 166, 255, 0.15);
      color: #d8eaff;
    }

    .anchor-controls .anchor-mode[data-anchor-mode="confirmed"].active {
      border-color: var(--edge-confirmed);
      color: #9ef0bd;
    }

    .anchor-controls .anchor-mode[data-anchor-mode="issues"].active {
      border-color: var(--edge-broken);
      color: #ffabb4;
    }

    .anchor-controls-spacer { flex: 1; }

    #graph-search {
      min-width: 80px;
      height: 31px;
      padding: 0 8px;
      flex: 1;
      font-size: 11px;
    }

    #graph-stage {
      position: relative;
      min-height: 0;
      overflow: hidden;
      touch-action: none;
      background:
        linear-gradient(rgba(40, 51, 68, 0.13) 1px, transparent 1px),
        linear-gradient(90deg, rgba(40, 51, 68, 0.13) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    #graph-svg {
      display: block;
      width: 100%;
      height: 100%;
      user-select: none;
    }

    .graph-edge {
      fill: none;
      stroke: #45566f;
      stroke-width: 1.5;
    }

    .graph-edge.anchor-selected {
      stroke-width: 4.2;
      stroke-opacity: 1;
      filter: drop-shadow(0 0 4px currentColor);
    }

    .graph-edge.anchor-subdued { stroke-opacity: 0.1; }

    .graph-edge-hit {
      fill: none;
      stroke: transparent;
      stroke-width: 16;
      cursor: pointer;
      pointer-events: stroke;
    }

    .graph-edge.edge-confirmed {
      stroke: var(--edge-confirmed);
      stroke-width: 2.4;
    }

    .graph-edge.edge-directed-code {
      stroke: var(--edge-code);
      stroke-width: 2.4;
    }

    .graph-edge.edge-anchor {
      stroke: var(--edge-anchor);
      stroke-width: 2;
    }

    .graph-edge.edge-coupled {
      stroke: var(--edge-coupled);
      stroke-width: 2;
    }

    .graph-edge.edge-contact {
      stroke: var(--edge-contact);
      stroke-dasharray: 8 6;
    }

    .graph-edge.edge-broken {
      stroke: var(--edge-broken);
      stroke-width: 2;
      stroke-dasharray: 5 5;
    }

    .graph-edge.edge-unknown {
      stroke: var(--edge-unknown);
      stroke-dasharray: 2 6;
      stroke-opacity: 0.72;
    }

    .graph-edge.edge-static-directed {
      stroke: var(--edge-code);
      stroke-dasharray: 8 6;
    }

    .graph-edge.edge-static-construction {
      stroke: var(--edge-coupled);
      stroke-dasharray: 3 6;
    }

    .graph-edge.call-edge { stroke-opacity: 0.34; }
    .graph-edge.subdued { stroke-opacity: 0.08; }
    .graph-edge.related {
      stroke: var(--accent);
      stroke-width: 2.2;
      stroke-opacity: 1;
    }

    .graph-group-band {
      stroke: none;
      pointer-events: none;
    }

    .graph-group-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      pointer-events: none;
    }

    .graph-edge-label {
      fill: #7f91a9;
      font-size: 9px;
      text-anchor: middle;
      pointer-events: none;
    }

    .graph-legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 13px;
      color: var(--muted);
      font-size: 10px;
    }

    .graph-legend[hidden] { display: none; }

    .graph-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .graph-legend-line {
      display: inline-block;
      width: 25px;
      height: 0;
      border-top: 2px solid var(--edge-unknown);
    }

    .graph-legend-line.confirmed { border-color: var(--edge-confirmed); }
    .graph-legend-line.code { border-color: var(--edge-code); }
    .graph-legend-line.anchor { border-color: var(--edge-anchor); }
    .graph-legend-line.coupled { border-color: var(--edge-coupled); }
    .graph-legend-line.contact {
      border-color: var(--edge-contact);
      border-top-style: dashed;
    }
    .graph-legend-line.broken {
      border-color: var(--edge-broken);
      border-top-style: dashed;
    }
    .graph-legend-line.unknown { border-top-style: dotted; }
    .graph-legend-line.static-code {
      border-color: var(--edge-code);
      border-top-style: dashed;
    }
    .graph-legend-line.static-construction {
      border-color: var(--edge-coupled);
      border-top-style: dotted;
    }

    .graph-node { cursor: pointer; }

    .graph-node rect {
      fill: #151d29;
      stroke: #34445a;
      stroke-width: 1.4;
    }

    .graph-node text {
      fill: #e3ecf7;
      pointer-events: none;
    }

    .graph-node .graph-node-label {
      font-size: 11px;
      font-weight: 600;
    }

    .graph-node .graph-node-meta {
      fill: #8ea0b8;
      font-size: 9px;
    }

    .graph-group-accent {
      stroke: none;
      pointer-events: none;
    }

    .graph-node.selected rect {
      fill: rgba(99, 166, 255, 0.2);
      stroke: var(--accent);
      stroke-width: 2;
    }

    .graph-node.edge-endpoint rect {
      stroke: #f5c86c;
      stroke-width: 2.6;
      filter: drop-shadow(0 0 5px rgba(245, 200, 108, 0.35));
    }

    .graph-node.match rect {
      stroke: #f2bd64;
      stroke-width: 2.5;
    }

    .graph-node.hidden-part { opacity: 0.38; }
    .graph-node.hidden-part .graph-node-label { text-decoration: line-through; }
    .graph-edge.hidden-part { stroke-opacity: 0.12; }

    .graph-collapse {
      fill: #26364a;
      stroke: #55708f;
      cursor: pointer;
    }

    .graph-collapse-mark {
      fill: #d9e7f7;
      font-size: 11px;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    .graph-empty {
      fill: #8ea0b8;
      font-size: 13px;
      text-anchor: middle;
    }

    .graph-footer {
      display: grid;
      gap: 5px;
      min-height: 78px;
      max-height: 126px;
      padding: 9px 12px;
      overflow: auto;
      border-top: 1px solid var(--line);
      background: #101720;
      font-size: 11px;
      line-height: 1.4;
    }

    .graph-panel.anchor-view .graph-footer {
      max-height: 235px;
    }

    #graph-status { color: var(--muted); }

    #graph-detail {
      color: #cfdaea;
      white-space: pre-wrap;
    }

    .anchor-relations {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 6px;
      max-height: 108px;
      padding-top: 5px;
      overflow: auto;
      border-top: 1px solid rgba(40, 51, 68, 0.72);
    }

    .anchor-relations[hidden] { display: none; }

    .anchor-relation-card {
      display: grid;
      grid-template-columns: 9px minmax(0, 1fr);
      gap: 7px;
      min-height: 47px;
      padding: 6px 8px;
      text-align: left;
    }

    .anchor-relation-card.active {
      border-color: #f5c86c;
      background: rgba(245, 200, 108, 0.1);
    }

    .anchor-relation-swatch {
      width: 4px;
      height: 100%;
      border-radius: 4px;
      background: var(--edge-unknown);
    }

    .anchor-relation-swatch.edge-confirmed { background: var(--edge-confirmed); }
    .anchor-relation-swatch.edge-directed-code { background: var(--edge-code); }
    .anchor-relation-swatch.edge-anchor { background: var(--edge-anchor); }
    .anchor-relation-swatch.edge-coupled { background: var(--edge-coupled); }
    .anchor-relation-swatch.edge-contact { background: var(--edge-contact); }
    .anchor-relation-swatch.edge-broken { background: var(--edge-broken); }

    .anchor-relation-main {
      display: block;
      overflow: hidden;
      color: #dfe9f6;
      font-size: 11px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .anchor-relation-meta {
      display: block;
      margin-top: 3px;
      overflow: hidden;
      color: #8fa2ba;
      font-size: 9px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .anchor-relation-card > span:last-child { min-width: 0; }

    .anchor-lane-bg {
      fill: #0d1520;
      stroke: #26364a;
      stroke-width: 1;
    }

    .anchor-lane-bg.selected {
      fill: rgba(245, 200, 108, 0.06);
      stroke: #8d7440;
      stroke-width: 1.5;
    }

    .anchor-lane-number {
      fill: #73849a;
      font-size: 11px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .anchor-lane-node { cursor: pointer; }

    .anchor-lane-node rect {
      fill: #151d29;
      stroke-width: 2;
    }

    .anchor-lane-node.endpoint-a rect { stroke: #63a6ff; }
    .anchor-lane-node.endpoint-b rect { stroke: #ad8cff; }

    .anchor-lane-node.selected rect,
    .anchor-lane-node:hover rect {
      fill: #1a2738;
      filter: drop-shadow(0 0 5px rgba(99, 166, 255, 0.24));
    }

    .anchor-lane-role {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .anchor-lane-node.endpoint-a .anchor-lane-role { fill: #83baff; }
    .anchor-lane-node.endpoint-b .anchor-lane-role { fill: #c0a9ff; }

    .anchor-lane-label {
      fill: #e3ecf7;
      font-size: 12px;
      font-weight: 650;
    }

    .anchor-lane-meta {
      fill: #8ea0b8;
      font-size: 9px;
    }

    .anchor-lane-center { cursor: pointer; }

    .anchor-lane-center rect {
      fill: rgba(69, 201, 192, 0.08);
      stroke: #45c9c0;
      stroke-width: 1.8;
    }

    .anchor-lane-center:hover rect,
    .anchor-lane-center.selected rect {
      fill: rgba(69, 201, 192, 0.16);
      filter: drop-shadow(0 0 6px rgba(69, 201, 192, 0.28));
    }

    .anchor-lane-center.confirmed rect {
      fill: rgba(85, 217, 139, 0.08);
      stroke: var(--edge-confirmed);
    }

    .anchor-lane-center.confirmed .anchor-lane-center-title { fill: #91edb5; }

    .anchor-lane-center-title {
      fill: #78e1d9;
      font-size: 10px;
      font-weight: 700;
      text-anchor: middle;
    }

    .anchor-lane-center-coordinate {
      fill: #e0f7f4;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      text-anchor: middle;
    }

    .anchor-lane-center-meta {
      fill: #8eb9b5;
      font-size: 9px;
      font-variant-numeric: tabular-nums;
      text-anchor: middle;
    }

    .anchor-lane-connector {
      fill: none;
      stroke: #45c9c0;
      stroke-width: 2.2;
    }

    .anchor-lane-connector.confirmed { stroke: var(--edge-confirmed); }

    .anchor-lane-connector-halo {
      fill: none;
      stroke: #081019;
      stroke-width: 6;
    }

    .issue-lane-node { cursor: pointer; }

    .issue-lane-node rect {
      fill: #1b171b;
      stroke-width: 2;
    }

    .issue-lane-node.endpoint-a rect { stroke: #e7a654; }
    .issue-lane-node.endpoint-b rect { stroke: #e8798b; }
    .issue-lane-node.selected rect,
    .issue-lane-node:hover rect { fill: #271e22; }

    .issue-lane-node.endpoint-a .anchor-lane-role { fill: #f2be78; }
    .issue-lane-node.endpoint-b .anchor-lane-role { fill: #f39aaa; }

    .issue-lane-center { cursor: pointer; }

    .issue-lane-center rect {
      fill: rgba(255, 116, 116, 0.08);
      stroke: var(--edge-broken);
      stroke-width: 1.8;
    }

    .issue-lane-center.contact-only rect {
      fill: rgba(231, 180, 93, 0.08);
      stroke: var(--edge-contact);
    }

    .issue-lane-center:hover rect,
    .issue-lane-center.selected rect {
      fill: rgba(255, 116, 116, 0.15);
      filter: drop-shadow(0 0 6px rgba(255, 116, 116, 0.25));
    }

    .issue-lane-center-title {
      fill: #ff9ca5;
      font-size: 10px;
      font-weight: 750;
      text-anchor: middle;
    }

    .issue-lane-center.contact-only .issue-lane-center-title { fill: #efc57f; }

    .issue-lane-coordinate {
      fill: #e8dfe3;
      font-size: 9px;
      font-variant-numeric: tabular-nums;
      text-anchor: middle;
    }

    .issue-lane-meta {
      fill: #b9a0a7;
      font-size: 9px;
      font-variant-numeric: tabular-nums;
      text-anchor: middle;
    }

    .issue-lane-connector {
      fill: none;
      stroke: var(--edge-broken);
      stroke-width: 2;
      stroke-dasharray: 6 5;
    }

    .issue-lane-connector.contact-only { stroke: var(--edge-contact); }

    .viewer {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 42%, rgba(52, 80, 120, 0.18), transparent 45%),
        #090d14;
    }

    #viewport {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .viewer-status {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 2;
      max-width: min(560px, calc(100% - 28px));
      padding: 9px 11px;
      border: 1px solid rgba(40, 51, 68, 0.9);
      border-radius: 9px;
      background: rgba(12, 17, 25, 0.82);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      backdrop-filter: blur(9px);
      white-space: pre-wrap;
    }

    .viewer-status.error {
      border-color: rgba(255, 141, 141, 0.45);
      color: var(--danger);
    }

    .viewer-status.success { color: var(--success); }

    .viewer-tools {
      position: absolute;
      right: 14px;
      top: 14px;
      z-index: 2;
      display: flex;
      gap: 7px;
    }

    .preview-selection {
      position: absolute;
      left: 14px;
      bottom: 14px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 9px;
      max-width: calc(100% - 28px);
      padding: 7px 8px 7px 11px;
      border: 1px solid rgba(245, 200, 108, 0.62);
      border-radius: 9px;
      background: rgba(31, 26, 16, 0.9);
      color: #f9d98f;
      font-size: 11px;
      backdrop-filter: blur(9px);
    }

    .preview-selection[hidden] { display: none; }

    .preview-selection.missing {
      border-color: rgba(255, 141, 141, 0.5);
      background: rgba(38, 19, 22, 0.9);
      color: #ffabb4;
    }

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from '/vendor/OrbitControls.js';
    import { GLTFLoader } from '/vendor/GLTFLoader.js';

    const sourceSelect = document.getElementById('source-select');
    const modelSelect = document.getElementById('model-select');
    const controlsHost = document.getElementById('controls');
    const panelTitle = document.getElementById('panel-title');
    const statusEl = document.getElementById('viewer-status');
    const loadingEl = document.getElementById('loading');
    const autoUpdateEl = document.getElementById('auto-update');
    const resetButton = document.getElementById('reset-button');
    const renderButton = document.getElementById('render-button');
    const fitButton = document.getElementById('fit-button');
    const rotateButton = document.getElementById('rotate-button');
    const previewSelection = document.getElementById('preview-selection');
    const previewSelectionLabel = document.getElementById('preview-selection-label');
    const previewSelectionClear = document.getElementById('preview-selection-clear');
    const canvas = document.getElementById('viewport');
    const graphStage = document.getElementById('graph-stage');
    const graphPanel = document.getElementById('graph-panel');
    const graphSvg = document.getElementById('graph-svg');
    const graphViewport = document.getElementById('graph-viewport');
    const graphEdges = document.getElementById('graph-edges');
    const graphNodes = document.getElementById('graph-nodes');
    const graphTabs = document.getElementById('graph-tabs');
    const graphSearch = document.getElementById('graph-search');
    const graphStatus = document.getElementById('graph-status');
    const graphDetail = document.getElementById('graph-detail');
    const graphLegend = document.getElementById('graph-legend');
    const anchorControls = document.getElementById('anchor-controls');
    const anchorRelations = document.getElementById('anchor-relations');
    const anchorClearFocusButton = document.getElementById('anchor-clear-focus');
    const graphFullscreenButton = document.getElementById('graph-fullscreen');
    const graphExpandButton = document.getElementById('graph-expand');
    const graphFitButton = document.getElementById('graph-fit');

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x090d14);
    scene.fog = new THREE.Fog(0x090d14, 16, 45);

    const camera = new THREE.PerspectiveCamera(42, 1, 0.01, 1000);
    camera.up.set(0, 1, 0);
    camera.position.set(4.5, 3.3, 6.5);

    const orbit = new OrbitControls(camera, canvas);
    orbit.enableDamping = true;
    orbit.dampingFactor = 0.065;
    orbit.zoomSpeed = 0.35;
    orbit.autoRotateSpeed = 1.6;
    orbit.target.set(0, 0, 1);

    scene.add(new THREE.HemisphereLight(0xd9e8ff, 0x253040, 2.2));
    const keyLight = new THREE.DirectionalLight(0xffffff, 3.2);
    keyLight.position.set(5, 7, 5);
    keyLight.castShadow = true;
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0x8eb9ff, 1.7);
    fillLight.position.set(-5, 4, 3);
    scene.add(fillLight);
    const rimLight = new THREE.DirectionalLight(0xffd7a0, 1.2);
    rimLight.position.set(1, 5, 7);
    scene.add(rimLight);

    const grid = new THREE.GridHelper(20, 40, 0x40516a, 0x253042);
    grid.material.opacity = 0.35;
    grid.material.transparent = true;
    scene.add(grid);

    const loader = new GLTFLoader();
    let schema = null;
    let values = {};
    let currentModel = null;
    let previewHighlightRequest = null;
    let renderTimer = null;
    let generationRunning = false;
    let generationQueued = false;
    let generationVersion = 0;
    let runtimeGraphVersion = 0;
    let selectionVersion = 0;
    let structureData = null;
    let partVisibilityByNode = new Map();
    let partVisibilityByRole = new Map();
    const graphState = {
      view: 'parts',
      collapsed: new Set(),
      selected: null,
      selectedEdge: null,
      anchorMode: 'confirmed',
      anchorFocusNode: null,
      query: '',
      scale: 1,
      tx: 20,
      ty: 20,
      dragging: false,
      dragX: 0,
      dragY: 0,
      startTx: 0,
      startTy: 0,
      positions: new Map(),
      content: { minX: 0, minY: 0, width: 1, height: 1 },
    };

    const svgNS = 'http://www.w3.org/2000/svg';
    const graphNodeWidth = 172;
    const graphNodeHeight = 56;
    const graphLeafGap = 214;
    const graphLevelGap = 132;

    function setStatus(message, kind = '') {
      statusEl.textContent = message;
      statusEl.className = `viewer-status ${kind}`.trim();
    }

    function setLoading(active) {
      loadingEl.classList.toggle('visible', active);
      loadingEl.setAttribute('aria-hidden', active ? 'false' : 'true');
    }

    function makeSvg(tag, attributes = {}) {
      const element = document.createElementNS(svgNS, tag);
      for (const [name, value] of Object.entries(attributes)) {
        element.setAttribute(name, String(value));
      }
      return element;
    }

    function graphView() {
      return structureData?.views?.[graphState.view] || null;
    }

    function truncateNodeLabel(value, length = 24) {
      const text = String(value);
      return text.length <= length ? text : `${text.slice(0, length - 1)}…`;
    }

    function graphGroupColor(group) {
      const palette = ['#63a6ff', '#8f86ff', '#49c5ad', '#f0aa5d', '#dc7da1', '#7cbd69', '#d3bd59', '#58a9cb'];
      let hash = 0;
      for (const character of String(group || 'Other')) {
        hash = ((hash << 5) - hash + character.charCodeAt(0)) | 0;
      }
      return palette[Math.abs(hash) % palette.length];
    }

    function computeLayeredGraphLayout(view) {
      const nodeById = new Map(view.nodes.map((node) => [node.id, node]));
      const children = new Map(view.nodes.map((node) => [node.id, []]));
      const incoming = new Map(view.nodes.map((node) => [node.id, []]));
      for (const edge of view.edges) {
        if (!children.has(edge.parent)) children.set(edge.parent, []);
        if (!incoming.has(edge.child)) incoming.set(edge.child, []);
        children.get(edge.parent).push(edge);
        incoming.get(edge.child).push(edge);
      }
      for (const edges of children.values()) {
        edges.sort((a, b) => (a.line || 0) - (b.line || 0) || a.child.localeCompare(b.child));
      }

      const roots = (view.roots || []).filter((id) => nodeById.has(id));
      const inferred = view.nodes
        .filter((node) => !(incoming.get(node.id) || []).length)
        .sort((a, b) => (a.line || 0) - (b.line || 0))
        .map((node) => node.id);
      if (!roots.length) roots.push(...inferred);

      const structurallyReachable = new Set();
      function markReachable(id, path) {
        if (!nodeById.has(id) || path.has(id)) return;
        structurallyReachable.add(id);
        const nextPath = new Set(path);
        nextPath.add(id);
        for (const edge of children.get(id) || []) markReachable(edge.child, nextPath);
      }
      for (const root of roots) markReachable(root, new Set());
      for (const id of inferred) {
        if (!structurallyReachable.has(id)) {
          roots.push(id);
          markReachable(id, new Set());
        }
      }
      for (const node of [...view.nodes].sort((a, b) => (a.line || 0) - (b.line || 0))) {
        if (!structurallyReachable.has(node.id)) {
          roots.push(node.id);
          markReachable(node.id, new Set());
        }
      }

      const depthById = new Map();
      const queue = [];
      for (const root of roots) {
        if (!depthById.has(root)) {
          depthById.set(root, 0);
          queue.push(root);
        }
      }
      while (queue.length) {
        const id = queue.shift();
        if (graphState.collapsed.has(id)) continue;
        const depth = depthById.get(id) || 0;
        for (const edge of children.get(id) || []) {
          if (depthById.has(edge.child)) continue;
          depthById.set(edge.child, depth + 1);
          queue.push(edge.child);
        }
      }

      const columns = new Map();
      for (const [id, depth] of depthById) {
        if (!columns.has(depth)) columns.set(depth, []);
        columns.get(depth).push(id);
      }
      for (const ids of columns.values()) {
        ids.sort((left, right) => {
          const a = nodeById.get(left);
          const b = nodeById.get(right);
          return (a?.line || 0) - (b?.line || 0) || String(a?.label).localeCompare(String(b?.label));
        });
      }

      const positions = new Map();
      const columnGap = 224;
      const rowGap = 68;
      const groupInfo = new Map();
      for (const [id, depth] of depthById) {
        const node = nodeById.get(id);
        const group = String(node?.group || 'Other');
        if (!groupInfo.has(group)) {
          groupInfo.set(group, { label: group, minLine: node?.line || 0, byDepth: new Map() });
        }
        const info = groupInfo.get(group);
        info.minLine = Math.min(info.minLine, node?.line || 0);
        if (!info.byDepth.has(depth)) info.byDepth.set(depth, []);
        info.byDepth.get(depth).push(id);
      }
      const orderedGroups = [...groupInfo.values()].sort((a, b) => {
        if (a.label === 'Module') return -1;
        if (b.label === 'Module') return 1;
        return a.minLine - b.minLine || a.label.localeCompare(b.label);
      });
      const groupHeaders = [];
      let groupCursor = 0;
      for (const info of orderedGroups) {
        for (const ids of info.byDepth.values()) {
          ids.sort((left, right) => {
            const a = nodeById.get(left);
            const b = nodeById.get(right);
            return (a?.line || 0) - (b?.line || 0) || String(a?.label).localeCompare(String(b?.label));
          });
        }
        const rowCount = Math.max(1, ...[...info.byDepth.values()].map((ids) => ids.length));
        const nodeStartY = groupCursor + 25;
        for (const [depth, ids] of info.byDepth) {
          ids.forEach((id, index) => positions.set(id, { x: depth * columnGap, y: nodeStartY + index * rowGap }));
        }
        const groupHeight = 25 + rowCount * rowGap + 13;
        groupHeaders.push({ label: info.label, y: groupCursor, height: groupHeight });
        groupCursor += groupHeight + 10;
      }
      const visibleEdges = view.edges.filter(
        (edge) => positions.has(edge.parent) && positions.has(edge.child)
      );
      const points = [...positions.values()];
      const maxX = points.length ? Math.max(...points.map((point) => point.x)) : 0;
      const maxY = points.length ? Math.max(...points.map((point) => point.y)) : 0;
      return {
        orientation: 'lr',
        nodeById,
        children,
        incoming,
        positions,
        groupHeaders,
        visibleEdges,
        content: {
          minX: 0,
          minY: 0,
          width: Math.max(graphNodeWidth, maxX + graphNodeWidth),
          height: Math.max(graphNodeHeight, maxY + graphNodeHeight + 13),
        },
      };
    }

    function computeGraphLayout(view) {
      if (
        graphState.view === 'definitions'
        || graphState.view === 'calls'
        || graphState.view === 'parts'
        || graphState.view === 'anchors'
      ) {
        return computeLayeredGraphLayout(view);
      }
      const nodeById = new Map(view.nodes.map((node) => [node.id, node]));
      const children = new Map(view.nodes.map((node) => [node.id, []]));
      const incoming = new Map(view.nodes.map((node) => [node.id, []]));
      for (const edge of view.edges) {
        if (!children.has(edge.parent)) children.set(edge.parent, []);
        if (!incoming.has(edge.child)) incoming.set(edge.child, []);
        children.get(edge.parent).push(edge);
        incoming.get(edge.child).push(edge);
      }
      for (const edges of children.values()) {
        edges.sort((a, b) => (a.line || 0) - (b.line || 0) || a.child.localeCompare(b.child));
      }

      const declaredRoots = (view.roots || []).filter((id) => nodeById.has(id));
      const inferredRoots = view.nodes
        .filter((node) => !(incoming.get(node.id) || []).length)
        .map((node) => node.id);
      const roots = declaredRoots.length ? declaredRoots : inferredRoots;
      const positions = new Map();
      const visible = new Set();
      const structurallyReachable = new Set();
      let leafCursor = 0;

      function markReachable(id, path) {
        if (!nodeById.has(id) || path.has(id)) return;
        structurallyReachable.add(id);
        const nextPath = new Set(path);
        nextPath.add(id);
        for (const edge of children.get(id) || []) markReachable(edge.child, nextPath);
      }

      for (const root of roots) markReachable(root, new Set());

      function place(id, depth, path) {
        if (!nodeById.has(id) || path.has(id)) return null;
        if (positions.has(id)) return positions.get(id).x;
        visible.add(id);
        const nextPath = new Set(path);
        nextPath.add(id);
        const outgoing = graphState.collapsed.has(id) ? [] : (children.get(id) || []);
        const childXs = [];
        for (const edge of outgoing) {
          const childX = place(edge.child, depth + 1, nextPath);
          if (childX !== null) childXs.push(childX);
        }
        const x = childXs.length
          ? (Math.min(...childXs) + Math.max(...childXs)) / 2
          : leafCursor++ * graphLeafGap;
        positions.set(id, { x, y: depth * graphLevelGap });
        return x;
      }

      for (const root of roots) place(root, 0, new Set());
      for (const node of view.nodes) {
        if (!positions.has(node.id) && !structurallyReachable.has(node.id)) {
          place(node.id, 0, new Set());
        }
      }

      const visibleEdges = view.edges.filter(
        (edge) => positions.has(edge.parent) && positions.has(edge.child)
      );
      const points = [...positions.values()];
      const minX = points.length ? Math.min(...points.map((point) => point.x)) : 0;
      const maxX = points.length ? Math.max(...points.map((point) => point.x)) : 0;
      const maxY = points.length ? Math.max(...points.map((point) => point.y)) : 0;
      return {
        orientation: 'tb',
        nodeById,
        children,
        incoming,
        positions,
        visible,
        visibleEdges,
        content: {
          minX,
          minY: 0,
          width: Math.max(graphNodeWidth, maxX - minX + graphNodeWidth),
          height: Math.max(graphNodeHeight, maxY + graphNodeHeight),
        },
      };
    }

    function updateGraphTransform() {
      graphViewport.setAttribute(
        'transform',
        `translate(${graphState.tx} ${graphState.ty}) scale(${graphState.scale})`
      );
    }

    function formatGraphNumber(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return '未知';
      if (Math.abs(number) >= 0.01) return number.toFixed(4);
      return number.toExponential(2);
    }

    function partNodeIsVisible(nodeOrId) {
      const node = typeof nodeOrId === 'string'
        ? structureData?.views?.parts?.nodes?.find((item) => item.id === nodeOrId)
        : nodeOrId;
      if (!node) return true;
      const nodeVisibilityId = partVisibilityByNode.get(node.id);
      if (nodeVisibilityId) return values[nodeVisibilityId] !== false;
      const partName = String(node.part_name || node.id || '');
      const role = partName.split('_', 1)[0];
      const roleVisibilityId = partVisibilityByRole.get(role);
      return roleVisibilityId ? values[roleVisibilityId] !== false : true;
    }

    function runtimeRelationLabel(edge) {
      const labels = {
        DIRECTED: '运行时确认父→子',
        DIRECTED_CODE: '代码确认父→子',
        COUPLED: '双向联动',
        DECLARED_CONSTRUCTION: '声明连接',
        UNDIRECTED_CONTACT: '仅接触',
        BROKEN_ATTACHMENT: '断裂或锚点错位',
        UNOBSERVABLE: edge.shared_anchor ? '共享锚点·方向未知' : '证据不足',
      };
      return labels[edge.relation] || edge.relation;
    }

    function isStrictAnchorEdge(edge) {
      return Boolean(
        edge.directed_verified
        && edge.contact
        && edge.shared_anchor
        && (edge.relation === 'DIRECTED' || edge.relation === 'DIRECTED_CODE')
      );
    }

    function anchorEdgeKey(edge) {
      return [
        edge.parent,
        edge.child,
        edge.relation,
        Number(edge.anchor_gap ?? -1).toPrecision(9),
      ].join('|');
    }

    function anchorModeLabel(mode) {
      return {
        confirmed: '确认父子',
        shared: '共享锚点',
        issues: '问题关系',
        all: '全部关系',
      }[mode] || mode;
    }

    function anchorEdgeMatches(edge, mode = graphState.anchorMode) {
      if (mode === 'confirmed') return isStrictAnchorEdge(edge);
      if (mode === 'shared') return Boolean(edge.shared_anchor);
      if (mode === 'issues') {
        return edge.relation === 'BROKEN_ATTACHMENT' || !edge.shared_anchor;
      }
      return true;
    }

    function anchorRelationListView(view) {
      if (graphState.view !== 'anchors') return view;
      let edges = view.edges.filter((edge) => anchorEdgeMatches(edge));
      if (graphState.anchorFocusNode) {
        edges = edges.filter(
          (edge) => edge.parent === graphState.anchorFocusNode || edge.child === graphState.anchorFocusNode
        );
      }
      const nodeIds = new Set(edges.flatMap((edge) => [edge.parent, edge.child]));
      if (graphState.anchorFocusNode) nodeIds.add(graphState.anchorFocusNode);
      if (!edges.length && view.nodes.length === 1) nodeIds.add(view.nodes[0].id);
      return {
        ...view,
        nodes: view.nodes.filter((node) => nodeIds.has(node.id)),
        edges,
        roots: (view.roots || []).filter((id) => nodeIds.has(id)),
      };
    }

    function anchorDisplayView(view) {
      return anchorRelationListView(view);
    }

    function edgeVisual(edge) {
      if (graphState.view === 'anchors') {
        const strictDirected = isStrictAnchorEdge(edge);
        if (strictDirected) {
          return {
            className: edge.relation === 'DIRECTED' ? 'edge-confirmed' : 'edge-directed-code',
            markerEnd: edge.relation === 'DIRECTED'
              ? 'url(#graph-arrow-confirmed)'
              : 'url(#graph-arrow-code)',
            label: runtimeRelationLabel(edge),
          };
        }
        if (edge.relation === 'BROKEN_ATTACHMENT') {
          return { className: 'edge-broken', markerEnd: '', label: runtimeRelationLabel(edge) };
        }
        if (edge.relation === 'COUPLED') {
          return { className: 'edge-coupled', markerEnd: '', label: runtimeRelationLabel(edge) };
        }
        if (edge.shared_anchor) {
          return { className: 'edge-anchor', markerEnd: '', label: runtimeRelationLabel(edge) };
        }
        if (edge.contact || edge.relation === 'UNDIRECTED_CONTACT' || edge.relation === 'DECLARED_CONSTRUCTION') {
          return { className: 'edge-contact', markerEnd: '', label: runtimeRelationLabel(edge) };
        }
        return { className: 'edge-unknown', markerEnd: '', label: runtimeRelationLabel(edge) };
      }
      if (graphState.view === 'parts') {
        const directedRelations = new Set([
          'DIRECTED_CODE',
          'PARENT_ASSIGNMENT',
          'METHOD_DATAFLOW',
          'ATTACHMENT_CALL',
        ]);
        if (directedRelations.has(edge.relation)) {
          return {
            className: 'edge-static-directed',
            markerEnd: 'url(#graph-arrow-code)',
            label: `${edge.relation} · 待锚点验证`,
          };
        }
        return {
          className: 'edge-static-construction',
          markerEnd: 'url(#graph-arrow-code)',
          label: `${edge.relation} · 构建关系`,
        };
      }
      return { className: '', markerEnd: 'url(#graph-arrow-code)', label: edge.relation || '' };
    }

    function updateGraphLegend() {
      const anchorView = graphState.view === 'anchors';
      anchorControls.hidden = !anchorView;
      anchorRelations.hidden = !anchorView;
      anchorClearFocusButton.hidden = !graphState.anchorFocusNode;
      graphPanel.classList.toggle('anchor-view', anchorView);
      for (const button of anchorControls.querySelectorAll('[data-anchor-mode]')) {
        const active = button.dataset.anchorMode === graphState.anchorMode;
        const anchorViewData = structureData?.views?.anchors;
        const count = anchorViewData?.edges?.filter(
          (edge) => anchorEdgeMatches(edge, button.dataset.anchorMode)
        ).length || 0;
        button.textContent = `${anchorModeLabel(button.dataset.anchorMode)} ${count}`;
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', String(active));
      }
      if (graphState.view === 'anchors') {
        graphLegend.hidden = false;
        graphLegend.innerHTML = `
          <span class="graph-legend-item"><i class="graph-legend-line confirmed"></i>实线箭头：运行时单向 + 接触 + 共享锚点</span>
          <span class="graph-legend-item"><i class="graph-legend-line code"></i>蓝色箭头：代码单向 + 接触 + 共享锚点</span>
          <span class="graph-legend-item"><i class="graph-legend-line anchor"></i>共享锚点已有代码/运行证据，方向未知</span>
          <span class="graph-legend-item"><i class="graph-legend-line contact"></i>仅接触</span>
          <span class="graph-legend-item"><i class="graph-legend-line broken"></i>断裂/锚点错位</span>
          <span class="graph-legend-item"><i class="graph-legend-line unknown"></i>仅几何接近，共享锚点未证明</span>`;
        return;
      }
      if (graphState.view === 'parts') {
        graphLegend.hidden = false;
        graphLegend.innerHTML = `
          <span class="graph-legend-item"><i class="graph-legend-line static-code"></i>静态父子候选：尚未通过共享锚点验证</span>
          <span class="graph-legend-item"><i class="graph-legend-line static-construction"></i>函数构建关系：不是几何实线边</span>`;
        return;
      }
      graphLegend.hidden = true;
      graphLegend.replaceChildren();
    }

    function showAnchorEdgeDetail(edge) {
      const connector = isStrictAnchorEdge(edge) ? ' → ' : ' — ';
      const lines = [
        `${edge.parent}${connector}${edge.child}`,
        `关系：${runtimeRelationLabel(edge)}`,
        `方向确认：${edge.directed_verified ? '是' : '否'}；接触：${edge.contact ? '是' : '否'}；几何点对齐：${edge.geometric_anchor_aligned ? '是' : '否'}；共享锚点已证明：${edge.shared_anchor ? '是' : '否'}`,
        `共享证据：${sharedAnchorEvidenceLabel(edge)}`,
        `锚点间距：${formatGraphNumber(edge.anchor_gap)}；容差：${formatGraphNumber(edge.anchor_tolerance)}`,
      ];
      if (edge.anchor_a?.length === 3 && edge.anchor_b?.length === 3) {
        lines.push(
          `A 世界坐标：(${edge.anchor_a.map((value) => formatGraphNumber(value)).join(', ')})`,
          `B 世界坐标：(${edge.anchor_b.map((value) => formatGraphNumber(value)).join(', ')})`
        );
      }
      graphDetail.textContent = lines.join('\n');
    }

    function sharedAnchorCoordinate(edge) {
      if (edge.anchor_a?.length !== 3 || edge.anchor_b?.length !== 3) return '坐标不可用';
      const midpoint = edge.anchor_a.map((value, index) => (value + edge.anchor_b[index]) / 2);
      return `(${midpoint.map((value) => formatGraphNumber(value)).join(', ')})`;
    }

    function anchorPointCoordinate(values) {
      if (values?.length !== 3) return '坐标不可用';
      return `(${values.map((value) => formatGraphNumber(value)).join(', ')})`;
    }

    function anchorIssueLabel(edge) {
      if (edge.relation === 'BROKEN_ATTACHMENT') return '断裂：连接锚点未对齐';
      if (edge.geometric_anchor_aligned && !edge.shared_anchor) {
        return '几何接近，但共享锚点未被代码或运行证明';
      }
      if (edge.contact && !edge.shared_anchor) return '对象接触，但世界锚点不共享';
      if (!edge.contact && !edge.shared_anchor) return '对象未接触，世界锚点不共享';
      return runtimeRelationLabel(edge);
    }

    function sharedAnchorEvidenceLabel(edge) {
      return ({
        runtime_direction: '运行时单向联动',
        code_direction: '代码单向数据流',
        runtime_or_code_coupling: '运行时双向联动或代码双向连接',
        code_construction: '代码连接/构建记录',
      })[edge.shared_anchor_evidence] || (edge.shared_anchor ? '已证明（未标注来源）' : '无');
    }

    function renderSharedAnchorLanes(rawView, view) {
      anchorRelations.hidden = true;
      if (!view.edges.length) {
        const message = makeSvg('text', { class: 'graph-empty', x: 410, y: 120 });
        message.textContent = graphState.anchorFocusNode
          ? `${graphState.anchorFocusNode} 没有共享锚点关系`
          : '当前模型没有共享锚点关系';
        graphNodes.append(message);
        graphStatus.textContent = `共享锚点 · 0/${rawView.edges.length} 条关系`;
        graphState.positions = new Map();
        graphState.content = { minX: 0, minY: 0, width: 820, height: 240 };
        updateGraphTransform();
        return;
      }

      if (
        graphState.selectedEdge
        && !view.edges.some((edge) => anchorEdgeKey(edge) === graphState.selectedEdge)
      ) graphState.selectedEdge = null;

      const nodeById = new Map(rawView.nodes.map((node) => [node.id, node]));
      const positions = new Map();
      const laneWidth = 890;
      const laneHeight = 102;
      const laneGap = 10;
      const laneX = 8;
      const endpointWidth = 220;
      const endpointHeight = 64;
      const leftX = 42;
      const centerX = 326;
      const centerWidth = 248;
      const rightX = 638;
      const query = graphState.query.trim().toLowerCase();

      function endpointGroup(node, x, y, role, side) {
        const group = makeSvg('g', {
          class: `anchor-lane-node endpoint-${side}`,
          transform: `translate(${x} ${y})`,
          'data-graph-node': node.id,
          role: 'button',
          tabindex: '0',
          'aria-label': `${role} ${node.label}`,
        });
        if (graphState.selected === node.id) group.classList.add('selected');
        if (
          query
          && (
            String(node.label).toLowerCase().includes(query)
            || String(node.id).toLowerCase().includes(query)
            || String(node.part_name || '').toLowerCase().includes(query)
          )
        ) group.classList.add('selected');
        group.append(makeSvg('rect', {
          x: 0,
          y: 0,
          width: endpointWidth,
          height: endpointHeight,
          rx: 9,
        }));
        const roleText = makeSvg('text', { class: 'anchor-lane-role', x: 12, y: 16 });
        roleText.textContent = role;
        group.append(roleText);
        const label = makeSvg('text', { class: 'anchor-lane-label', x: 12, y: 36 });
        label.textContent = truncateNodeLabel(node.label, 30);
        group.append(label);
        const meta = makeSvg('text', { class: 'anchor-lane-meta', x: 12, y: 53 });
        meta.textContent = truncateNodeLabel(node.part_name || node.group || node.id, 34);
        group.append(meta);
        const title = makeSvg('title');
        title.textContent = `${role}：${node.label}`;
        group.append(title);
        return group;
      }

      view.edges.forEach((edge, index) => {
        const key = anchorEdgeKey(edge);
        const selected = graphState.selectedEdge === key;
        const confirmed = isStrictAnchorEdge(edge);
        const rowY = index * (laneHeight + laneGap) + 8;
        const endpointY = rowY + 19;
        const lineY = endpointY + endpointHeight / 2;
        const parentNode = nodeById.get(edge.parent) || { id: edge.parent, label: edge.parent };
        const childNode = nodeById.get(edge.child) || { id: edge.child, label: edge.child };

        const background = makeSvg('rect', {
          class: `anchor-lane-bg${selected ? ' selected' : ''}`,
          x: laneX,
          y: rowY,
          width: laneWidth,
          height: laneHeight,
          rx: 10,
        });
        graphEdges.append(background);
        const number = makeSvg('text', {
          class: 'anchor-lane-number',
          x: 25,
          y: rowY + laneHeight / 2,
        });
        number.textContent = String(index + 1);
        graphEdges.append(number);

        for (const [x1, x2] of [
          [leftX + endpointWidth, centerX],
          [centerX + centerWidth, rightX],
        ]) {
          graphEdges.append(makeSvg('path', {
            class: 'anchor-lane-connector-halo',
            d: `M ${x1} ${lineY} L ${x2} ${lineY}`,
          }));
          const connector = makeSvg('path', {
            class: `anchor-lane-connector${confirmed ? ' confirmed' : ''}`,
            d: `M ${x1} ${lineY} L ${x2} ${lineY}`,
          });
          if (confirmed && x2 === rightX) connector.setAttribute('marker-end', 'url(#graph-arrow-confirmed)');
          graphEdges.append(connector);
        }

        const center = makeSvg('g', {
          class: `anchor-lane-center${confirmed ? ' confirmed' : ''}${selected ? ' selected' : ''}`,
          transform: `translate(${centerX} ${endpointY})`,
          'data-anchor-edge': key,
          role: 'button',
          tabindex: '0',
          'aria-label': `查看 ${edge.parent} 与 ${edge.child} 的共享锚点`,
        });
        center.append(makeSvg('rect', {
          x: 0,
          y: 0,
          width: centerWidth,
          height: endpointHeight,
          rx: 9,
        }));
        const centerTitle = makeSvg('text', {
          class: 'anchor-lane-center-title',
          x: centerWidth / 2,
          y: 16,
        });
        centerTitle.textContent = confirmed ? '共享锚点 · 确认父 → 子' : '共享锚点已证明 · 方向未知';
        center.append(centerTitle);
        const coordinate = makeSvg('text', {
          class: 'anchor-lane-center-coordinate',
          x: centerWidth / 2,
          y: 36,
        });
        coordinate.textContent = sharedAnchorCoordinate(edge);
        center.append(coordinate);
        const centerMeta = makeSvg('text', {
          class: 'anchor-lane-center-meta',
          x: centerWidth / 2,
          y: 53,
        });
        centerMeta.textContent = `间距 ${formatGraphNumber(edge.anchor_gap)} · 容差 ${formatGraphNumber(edge.anchor_tolerance)}`;
        center.append(centerMeta);
        const centerTooltip = makeSvg('title');
        centerTooltip.textContent = `${edge.parent} — ${edge.child}\n${runtimeRelationLabel(edge)}`;
        center.append(centerTooltip);

        graphNodes.append(
          endpointGroup(parentNode, leftX, endpointY, confirmed ? '父节点' : '端点 A', 'a'),
          center,
          endpointGroup(childNode, rightX, endpointY, confirmed ? '子节点' : '端点 B', 'b')
        );
        if (!positions.has(parentNode.id)) positions.set(parentNode.id, { x: leftX, y: endpointY });
        if (!positions.has(childNode.id)) positions.set(childNode.id, { x: rightX, y: endpointY });
      });

      graphState.positions = positions;
      graphState.content = {
        minX: 0,
        minY: 0,
        width: laneWidth + 16,
        height: view.edges.length * (laneHeight + laneGap) + 6,
      };
      const focus = graphState.anchorFocusNode ? ` · 只看 ${graphState.anchorFocusNode}` : '';
      graphStatus.textContent = `共享锚点 · ${view.edges.length} 条关系${focus} · 只保留有代码或运行证据的关系 · 无箭头的 A/B 表示方向未知`;
      updateGraphTransform();
    }

    function renderIssueAnchorLanes(rawView, view) {
      anchorRelations.hidden = true;
      if (!view.edges.length) {
        const message = makeSvg('text', { class: 'graph-empty', x: 470, y: 120 });
        message.textContent = graphState.anchorFocusNode
          ? `${graphState.anchorFocusNode} 没有问题关系`
          : '当前模型没有问题关系';
        graphNodes.append(message);
        graphStatus.textContent = `问题关系 · 0/${rawView.edges.length} 条关系`;
        graphState.positions = new Map();
        graphState.content = { minX: 0, minY: 0, width: 960, height: 240 };
        updateGraphTransform();
        return;
      }

      if (
        graphState.selectedEdge
        && !view.edges.some((edge) => anchorEdgeKey(edge) === graphState.selectedEdge)
      ) graphState.selectedEdge = null;

      const nodeById = new Map(rawView.nodes.map((node) => [node.id, node]));
      const positions = new Map();
      const laneWidth = 980;
      const laneHeight = 114;
      const laneGap = 10;
      const endpointWidth = 204;
      const endpointHeight = 68;
      const leftX = 42;
      const centerX = 286;
      const centerWidth = 450;
      const rightX = 776;
      const query = graphState.query.trim().toLowerCase();

      function issueEndpointGroup(node, x, y, role, side) {

          class: `issue-lane-node endpoint-${side}`,

          'data-graph-node': node.id,
          role: 'button',
          tabindex: '0',

        if (graphState.selected === node.id) group.classList.add('selected');
        if (

          && (

            || String(node.id).toLowerCase().includes(query)
            || String(node.part_name || '').toLowerCase().includes(query)
          )
        ) group.classList.add('selected');
        group.append(makeSvg('rect', {
          x: 0,
          y: 0,
          width: endpointWidth,
          height: endpointHeight,
          rx: 9,
        }));
        const roleText = makeSvg('text', { class: 'anchor-lane-role', x: 12, y: 17 });
        roleText.textContent = role;

        const label = makeSvg('text', { class: 'anchor-lane-label', x: 12, y: 39 });
        label.textContent = truncateNodeLabel(node.label, 27);
        group.append(label);
        const meta = makeSvg('text', { class: 'anchor-lane-meta', x: 12, y: 57 });
        meta.textContent = truncateNodeLabel(node.part_name || node.group || node.id, 30);
        group.append(meta);
        const title = makeSvg('title');
        title.textContent = `${role}：${node.label}`;
        group.append(title);
